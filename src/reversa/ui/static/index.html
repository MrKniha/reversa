<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVERSA</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233b6fd8'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='monospace'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand" title="REVERSA">REVERSA</div>
  <button id="btn-open" class="primary" data-i18n="btn.open">Otvoriť súbor</button>
  <input id="file-input" type="file" hidden>
  <button id="btn-demo" data-i18n="btn.demo">Skúšobná binárka</button>
  <button id="btn-save" data-i18n="btn.save" disabled>Uložiť projekt</button>
  <span class="sep"></span>
  <button id="btn-undo" data-i18n="btn.undo" disabled>Späť</button>
  <button id="btn-redo" data-i18n="btn.redo" disabled>Znova</button>
  <div class="search-wrap"><input id="search" type="search" data-i18n-ph="search.placeholder" aria-label="Hľadať" autocomplete="off"><div id="search-suggest" class="suggest" hidden></div></div>
  <div class="menu-wrap">
    <button id="btn-advanced" data-i18n="btn.advanced" aria-haspopup="true">Pokročilé</button>
    <div id="adv-menu" class="menu" hidden></div>
  </div>
  <button id="btn-theme" class="icon" data-i18n-title="btn.theme" aria-label="Motív">◐</button>
  <button id="btn-settings" class="icon" data-i18n-title="btn.settings" aria-label="Nastavenia">⚙</button>
  <button id="btn-help" class="icon" data-i18n-title="btn.help" aria-label="Pomoc">?</button>
</header>
<div id="errorbar" class="errorbar" hidden role="alert"><span id="error-text"></span><button id="error-copy" data-i18n="btn.copy_detail"></button><button id="error-close" class="icon" aria-label="Zavrieť">×</button></div>
<main class="layout">
  <aside class="sidebar" aria-label="Funkcie">
    <div class="panel-head"><span data-i18n="panel.functions">Funkcie</span> <span id="func-count" class="muted"></span><button class="help" data-help="functions" aria-label="Pomoc">?</button></div>
    <input id="func-filter" type="search" data-i18n-ph="filter.placeholder" aria-label="Filtrovať funkcie">
    <div id="func-list" class="list" tabindex="0"></div>
  </aside>
  <section class="center">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="banner" class="banner" hidden><span id="banner-text"></span><button id="banner-close" data-i18n="btn.understood">Rozumiem</button></div>
    <div id="view" class="view" tabindex="0"></div>
  </section>
  <aside class="details" aria-label="Detaily">
    <div class="panel-head"><span data-i18n="panel.details">Detaily</span><button class="help" data-help="details" aria-label="Pomoc">?</button></div>
    <div id="details" class="details-body"></div>
  </aside>
</main>
<footer class="statusbar">
  <span id="status-text"></span>
  <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>
  <button id="btn-cancel" class="small" hidden data-i18n="btn.cancel">Zrušiť</button>
  <span class="grow"></span>
  <span id="status-file" class="muted"></span>
</footer>
<dialog id="dlg"><form method="dialog" id="dlg-form"><p id="dlg-text"></p><div id="dlg-body"></div><input id="dlg-input" autocomplete="off"><menu><button value="cancel" data-i18n="btn.cancel">Zrušiť</button><button value="ok" class="primary" id="dlg-ok" data-i18n="btn.ok">OK</button></menu></form></dialog>
<div id="onboarding" class="onboarding" hidden><div class="onb-card" role="dialog" aria-labelledby="onb-title"><div class="onb-step" id="onb-step"></div><h2 id="onb-title"></h2><p id="onb-text"></p><div class="onb-actions"><button id="onb-skip" data-i18n="btn.skip">Preskočiť</button><span class="grow"></span><button id="onb-demo" data-i18n="btn.demo" hidden>Skúšobná binárka</button><button id="onb-prev" data-i18n="btn.back">Späť</button><button id="onb-next" class="primary" data-i18n="btn.next">Ďalej</button></div></div></div>
<div id="popover" class="popover" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
