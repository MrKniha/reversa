name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8  # Windows runners default to cp1252, which lacks Slovak letters

jobs:
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: License check
        run: python3 scripts/check_licenses.py

  build:
    name: build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - os: windows-2022
            cmake_args: >-
              -G "Visual Studio 17 2022" -A x64
              -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev
      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DREVERSA_GUI=OFF -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python API tests
        shell: bash
        run: |
          python -m pip install --require-hashes -r tests/requirements-dev.lock
          REVERSA_BUILD_DIR=build python -m pytest -q tests/python
      - name: Headless check
        shell: bash
        run: python scripts/headless_check.py build/bin/reversa headless-out
