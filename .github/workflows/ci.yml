name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked runtime dependencies + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]"
      - name: License check
        run: python scripts/check_licenses.py
      - name: Tests with coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=80
      - name: Headless check
        run: python scripts/headless_check.py headless-out

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install --require-hashes -r requirements.lock && pip install -e .
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tests/ui/smoke.mjs

  package:
    name: package (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: dist/reversa
            artifact: reversa-linux-x64
          - os: windows-latest
            exe: dist/reversa.exe
            artifact: reversa-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wheel
        run: |
          pip install build
          python -m build
      - name: Standalone executable (no Python needed on the target machine)
        shell: bash
        run: |
          pip install --require-hashes -r requirements.lock
          pip install . pyinstaller==6.22.3
          pyinstaller --onefile --name reversa --collect-all reversa --collect-all capstone src/reversa/__main__.py
      - name: Smoke test the executable
        shell: bash
        run: |
          ${{ matrix.exe }} --version
          ${{ matrix.exe }} --demo --no-gui
          ${{ matrix.exe }} analyze samples/bin/login_x64.exe --report report.md --no-plugins
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            ${{ matrix.exe }}
