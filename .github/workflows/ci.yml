name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8  # Windows runners default to cp1252, which lacks Slovak letters

# Third-party actions are pinned to commit SHAs (supply-chain safety); the comment names the tag.
jobs:
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: License check
        run: python3 scripts/check_licenses.py
      - name: Translation check (every GUI text in en, de, fr, zh)
        run: python3 scripts/i18n.py check

  linux:
    name: Linux (build, tests, .deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Packages (system Qt 6, SQLite, Python, so the .deb depends on distribution packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev qt6-base-dev libgl-dev python3-dev python3-venv
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build --parallel
      - name: C++ and GUI tests
        run: ctest --test-dir build --output-on-failure
      - name: Python API tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r tests/requirements-dev.lock
          REVERSA_BUILD_DIR=build .venv/bin/python -m pytest -q tests/python
      - name: Headless check
        run: python3 scripts/headless_check.py build/bin/reversa headless-out
      - name: Package (.deb) and test the installed package
        run: |
          cd build && cpack -G DEB && cd ..
          sudo apt-get install -y ./build/reversa_*.deb
          reversa --version
          reversa script /usr/share/reversa/examples/scripts/strcmp_callers.py samples/bin/login_x64.exe | grep check_password
          reversa --demo --no-gui
          reversa gui 2>&1 | grep "no display is available"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reversa-linux-x64-deb
          path: build/reversa_*.deb

  windows:
    name: Windows (build, tests, portable zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Configure (SQLite from vcpkg, version locked by vcpkg.json)
        shell: bash
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: C++ and GUI tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python API tests
        shell: bash
        run: |
          python -m pip install --require-hashes -r tests/requirements-dev.lock
          REVERSA_BUILD_DIR=build python -m pytest -q tests/python
      - name: Headless check
        shell: bash
        run: python scripts/headless_check.py build/bin/reversa.exe headless-out
      - name: Portable package (Qt via windeployqt, bundled Python runtime)
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist/reversa
          python scripts/package_windows.py dist/reversa reversa-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reversa-windows-x64
          path: reversa-windows-x64.zip
