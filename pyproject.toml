[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reversa"
version = "0.1.0"
description = "Open-source reverse engineering platform for beginners and professionals: disassembler, pseudocode, x-refs, graphs, Python API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "REVERSA contributors" }]
keywords = ["reverse-engineering", "disassembler", "decompiler", "elf", "pe", "ctf", "security"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
]
dependencies = ["capstone>=5.0.1,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]

[project.scripts]
reversa = "reversa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reversa = ["ui/static/*", "ui/i18n/*.json", "demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["reversa"]
omit = ["*/reversa/__main__.py"]

[tool.coverage.report]
show_missing = false
skip_covered = true
